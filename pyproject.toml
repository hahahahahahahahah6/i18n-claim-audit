[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "i18n-claim-audit"
version = "0.1.0"
description = "Offline static audit of documented language-support promises"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "i18n-claim-audit contributors"}]
dependencies = []

[project.scripts]
i18n-claim-audit = "i18n_claim_audit.cli:main"

[tool.setuptools.packages.find]
include = ["i18n_claim_audit*"]
